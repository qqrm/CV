name: post-deploy-verify

# Read-only HTTP checks using the trusted workflow revision, never PR artifacts.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [release-site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deployed-site:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the trusted verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify deployed pages and assets
        run: python3 .github/scripts/verify_deployed_site.py
