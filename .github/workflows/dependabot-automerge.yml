name: Enable Dependabot auto-merge

on:
  # Mandatory: collapse-history purges the run history, and GitHub drops
  # any workflow that has neither runs nor workflow_dispatch. A PR-only
  # workflow can never revive itself, because no event reaches it.
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
